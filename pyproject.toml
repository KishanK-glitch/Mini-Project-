[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-retrieval"
version = "0.1.0"
description = "Natural language-based video retrieval for surveillance using vision-language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "ultralytics>=8.3",
    "openvino>=2024.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25",
    "supervision>=0.22,<0.30",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40,<5",
    "SQLAlchemy>=2.0",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
